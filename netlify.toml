# set-06/task-1 설계 문서 사이트 — Netlify Git 연동 배포 설정
# 대시보드 import 시 이 파일이 빌드 설정을 대신하므로 수동 입력 불필요.
# base 를 지정하면 Netlify 기본 ignore 가 base 디렉토리 변경 여부로 빌드를 스킵한다
# (다른 세트 작업 push 는 재배포 안 됨).
[build]
  base    = "set-06/task-1/site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
