# ===========================================================================
# eksctl Cluster Manifest (요구사항 9)
#
# [1단계] terraform 디렉터리에서 아래 명령어로 환경변수를 설정하세요.
#
#   export ACCOUNT_ID=$(terraform output -raw account_id)
#   export EKS_KMS_KEY_ARN=$(terraform output -raw eks_kms_key_arn)
#   export VPC_ID=$(terraform output -raw vpc_id)
#   export WORKLOAD_SUBNET_A=$(terraform output -json workload_subnet_ids | jq -r '.["wsc-workload-a"]')
#   export WORKLOAD_SUBNET_C=$(terraform output -json workload_subnet_ids | jq -r '.["wsc-workload-c"]')
#
# [2단계] envsubst 로 실제 값을 치환한 뒤 적용하세요.
#
#   envsubst < cluster-example.yaml > cluster.yaml
#   eksctl create cluster -f cluster.yaml
# ===========================================================================
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: wsc-eks-cluster
  region: ap-northeast-2
  version: "1.35"

# ----- 기존(Terraform 생성) VPC / Workload Subnet 재사용 -----
# EKS 는 Workload Subnet 에서만 운용한다 (요구사항 9).
vpc:
  id: "${VPC_ID}"
  subnets:
    private:
      wsc-workload-a:
        id: "${WORKLOAD_SUBNET_A}"
        az: ap-northeast-2a
      wsc-workload-c:
        id: "${WORKLOAD_SUBNET_C}"
        az: ap-northeast-2c
# Workload Subnet 은 인터넷이 없으므로 Private Cluster 로 구성.
# VPC Endpoint 는 Terraform 에서 이미 생성했으므로 eksctl 생성은 건너뛴다.
# 주의: eks/eks-auth Interface Endpoint 를 private_dns_enabled=true 로 두면
#        eks.region.amazonaws.com PHZ 가 VPC 에 생성되어
#        oidc.eks.* 조회를 가로채 NXDOMAIN 반환 → withOIDC / IRSA 파괴.
#        따라서 해당 두 엔드포인트는 Terraform 에서 생성하지 않는다 (endpoints.tf 참고).
privateCluster:
  enabled: true
  skipEndpointCreation: true

# ----- Secret Resource KMS Envelope Encryption (요구사항 9.1) -----
secretsEncryption:
  keyARN: "${EKS_KMS_KEY_ARN}"

# ----- Control Plane 모든 로그 -> CloudWatch Logs (요구사항 9) -----
cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]

# ----- OIDC + IRSA ServiceAccount (요구사항 9.4) -----
iam:
  withOIDC: true
  serviceAccounts:
    # 앱 Pod: EC2 IAM 대신 ServiceAccount 권한 사용
    - metadata:
        name: wsc-sa
        namespace: wsc
      attachPolicyARNs:
        - "arn:aws:iam::${ACCOUNT_ID}:policy/wsc-app-policy"
    # AWS Load Balancer Controller
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      wellKnownPolicies:
        awsLoadBalancerController: true
    # EBS CSI Driver (CMK 암호화 추가 권한 포함)
    - metadata:
        name: ebs-csi-controller-sa
        namespace: kube-system
      wellKnownPolicies:
        ebsCSIController: true
      attachPolicyARNs:
        - "arn:aws:iam::${ACCOUNT_ID}:policy/wsc-ebs-csi-kms-policy"
    # Fluent Bit -> CloudWatch Logs
    - metadata:
        name: fluent-bit
        namespace: logging
      attachPolicyARNs:
        - "arn:aws:iam::${ACCOUNT_ID}:policy/wsc-fluentbit-policy"

# ===========================================================================
# Managed Node Groups (요구사항 9.2 / 9 페이지 5)
# - 모두 Managed, AL2023, t3.medium, Workload Subnet, 최소 고가용성(AZ 분산)
# - SSH Password(Skill53##) 접속, curl/ping 동작, EBS KMS 암호화
# - 노드명 <INSTANCE_ID>.ec2.internal, 내부 도메인 wsc.local
#   (preBootstrapCommands + CoreDNS 패치로 적용)
# ===========================================================================
managedNodeGroups:
  # ---------- App NodeGroup: label type=app ----------
  - name: wsc-app-ng
    amiFamily: AmazonLinux2023
    instanceType: t3.medium
    minSize: 2
    maxSize: 4
    desiredCapacity: 2
    privateNetworking: true
    volumeSize: 30
    volumeType: gp3
    volumeEncrypted: true
    volumeKmsKeyID: "${EKS_KMS_KEY_ARN}"
    # IMDSv1 비활성화 + hop limit=1 → Pod 에서 IMDS 접근 차단 (요구사항 9.4)
    disableIMDSv1: true
    disablePodIMDS: true
    labels:
      type: app
    tags:
      Name: wsc-app-node
    ssh:
      enableSsm: true
    # ECR Pull-Through Cache 에 필요한 추가 액션(BatchImportUpstreamImage, CreateRepository)을
    # attachPolicyARNs 로 주입. managed node group 은 기본 정책을 명시해야 한다.
    iam:
      attachPolicyARNs:
        - "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
        - "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
        - "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - "arn:aws:iam::${ACCOUNT_ID}:policy/wsc-ecr-pull-through-policy"
    overrideBootstrapCommand: &nodeadm_config |
      apiVersion: node.eks.aws/v1alpha1
      kind: NodeConfig
      spec:
        kubelet:
          config:
            clusterDomain: wsc.local
    preBootstrapCommands: &common_bootstrap
      - "dnf -y install iputils bind-utils curl-minimal || true"
      - "echo 'ec2-user:Skill53##' | chpasswd"
      - "mkdir -p /etc/ssh/sshd_config.d && echo 'PasswordAuthentication yes' > /etc/ssh/sshd_config.d/60-wsc.conf"
      - "systemctl restart sshd"


  # ---------- Addon NodeGroup: label type=addon ----------
  - name: wsc-addon-ng
    amiFamily: AmazonLinux2023
    instanceType: t3.medium
    minSize: 2
    maxSize: 3
    desiredCapacity: 2
    privateNetworking: true
    volumeSize: 30
    volumeType: gp3
    volumeEncrypted: true
    volumeKmsKeyID: "${EKS_KMS_KEY_ARN}"
    disableIMDSv1: true
    disablePodIMDS: true
    labels:
      type: addon
    tags:
      Name: wsc-addon-node
    ssh:
      enableSsm: true
    iam:
      attachPolicyARNs:
        - "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
        - "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
        - "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - "arn:aws:iam::${ACCOUNT_ID}:policy/wsc-ecr-pull-through-policy"
    preBootstrapCommands: *common_bootstrap

  # ---------- Monitoring NodeGroup: label type=monitoring ----------
  - name: wsc-monitoring-ng
    amiFamily: AmazonLinux2023
    instanceType: t3.medium
    minSize: 2
    maxSize: 3
    desiredCapacity: 2
    privateNetworking: true
    volumeSize: 50
    volumeType: gp3
    volumeEncrypted: true
    volumeKmsKeyID: "${EKS_KMS_KEY_ARN}"
    disableIMDSv1: true
    disablePodIMDS: true
    labels:
      type: monitoring
    tags:
      Name: wsc-monitoring-node
    ssh:
      enableSsm: true
    iam:
      attachPolicyARNs:
        - "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
        - "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
        - "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - "arn:aws:iam::${ACCOUNT_ID}:policy/wsc-ecr-pull-through-policy"
    preBootstrapCommands: *common_bootstrap

# ----- 필수 Addon (EBS CSI Driver 등) -----
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
