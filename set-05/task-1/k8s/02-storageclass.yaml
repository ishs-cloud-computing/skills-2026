# StorageClass (요구사항 9.6): EBS CSI + CMK 암호화, WaitForFirstConsumer(Pod AZ 맞춤).
# <EKS_KMS_KEY_ARN> 은 terraform 의 eks KMS key arn 으로 치환.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: wsc-sc
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  type: gp3
  encrypted: "true"
  kmsKeyId: "<EKS_KMS_KEY_ARN>"
