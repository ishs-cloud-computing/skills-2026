# App Deployment (요구사항 9.3/9.4, Reference02): wsc-deploy / wsc-cnt, label app=wsc-deploy.
# App NG(type=app) 전용, replicas 2 + AZ topologySpread + PDB, IRSA(wsc-sa)·IMDS 차단,
# 환경변수는 ConfigMap(wsc-config) 참조. <ECR_REPOSITORY_URL> 은 terraform output 으로 치환.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsc-deploy
  namespace: wsc
  labels:
    app: wsc-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wsc-deploy
  template:
    metadata:
      labels:
        app: wsc-deploy
    spec:
      serviceAccountName: wsc-sa
      # IRSA 토큰만 마운트, 노드(EC2) IAM 사용 차단 보조
      automountServiceAccountToken: true
      # App NodeGroup 에서만 스케줄
      nodeSelector:
        type: app
      # AZ 분산으로 최소 고가용성 확보
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: wsc-deploy
      containers:
        - name: wsc-cnt
          image: "<ECR_REPOSITORY_URL>:v1.0.0"
          ports:
            - containerPort: 8080
          # 환경변수는 전부 ConfigMap 참조.
          envFrom:
            - configMapRef:
                name: wsc-config
          # 채점 6-7-B 는 .env 에 configMapKeyRef 가 1개 이상 있고 리터럴 value 가
          # 없을 것을 요구한다(envFrom 은 .env 로 보이지 않음). 제거 금지.
          env:
            - name: AWS_EC2_METADATA_DISABLED
              valueFrom:
                configMapKeyRef:
                  name: wsc-config
                  key: AWS_EC2_METADATA_DISABLED
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
