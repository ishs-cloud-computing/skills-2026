# TargetGroupBinding (ALB Controller CRD): wsc-app-tg(IP TG) 에 wsc-svc Pod IP 등록.
# CloudFront -> VPC Origin -> wsc-app-lb -> TG -> 앱 Pod.
# <APP_TARGET_GROUP_ARN> 은 terraform output app_target_group_arn 으로 치환.
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: wsc-app-tgb
  namespace: wsc
spec:
  serviceRef:
    name: wsc-svc
    port: 8080
  targetGroupARN: "<APP_TARGET_GROUP_ARN>"
  targetType: ip
