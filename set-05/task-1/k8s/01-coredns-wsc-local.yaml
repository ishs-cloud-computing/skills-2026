# CoreDNS Corefile 패치 (요구사항 9.2): kubernetes 플러그인 존을 cluster.local →
# wsc.local 로 변경. FQDN(svc.wsc.local) 접근이라 kubelet clusterDomain 오버라이드 불필요.
# 적용 후: kubectl -n kube-system rollout restart deploy/coredns
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        kubernetes wsc.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }
