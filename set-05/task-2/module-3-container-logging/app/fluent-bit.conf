# 제공 배포파일 — Fluent Bit (EC2 호스트 systemd) 설정.
# Docker json-file 컨테이너 로그를 tail -> record_modifier 로 namespace=wsc-app-log
# 레이블 추가 -> Loki 엔드포인트(NLB:3100)로 전송한다.
# __LOKI_HOST__ 는 배포 후 Loki NLB DNS 로 치환한다 (README 참조).
[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Refresh_Interval  1
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

# namespace 레이블 값을 wsc-app-log 로 추가
[FILTER]
    Name    record_modifier
    Match   *
    Record  namespace wsc-app-log

[OUTPUT]
    Name        loki
    Match       *
    Host        __LOKI_HOST__
    Port        3100
    label_keys  $namespace
    line_format json
