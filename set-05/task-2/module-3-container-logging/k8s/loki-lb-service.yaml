# ---------------------------------------------------------------------------
# Loki LoadBalancer(NLB) Service (과제지 5. Loki 구성)
# - EC2 Fluent Bit 이 Public -> NLB 경유로 로그를 Push 하도록 3100 을 외부 노출.
# - app.kubernetes.io/name=loki, component=single-binary 라벨로 단일 바이너리 Pod 선택.
# - EKS Cloud Controller 가 internet-facing NLB 를 생성한다(LB Controller 불필요).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: loki-lb
  namespace: wsc-logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http-metrics
      port: 3100
      targetPort: 3100
      protocol: TCP
