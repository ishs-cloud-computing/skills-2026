# ===========================================================================
# eksctl Cluster Manifest — EKS Scaling (과제지 3)
#
# [1단계] terraform 디렉터리에서 환경변수를 설정하세요.
#
#   export ACCOUNT_ID=$(terraform output -raw account_id)
#   export VPC_ID=$(terraform output -raw vpc_id)
#   export PRIV_SUBNET_A=$(terraform output -json private_subnet_ids | jq -r '.["wsc-scaling-sn-priv-a"]')
#   export PRIV_SUBNET_C=$(terraform output -json private_subnet_ids | jq -r '.["wsc-scaling-sn-priv-c"]')
#
# [2단계] envsubst 로 치환 후 생성하세요.
#
#   envsubst < cluster.yaml > cluster.rendered.yaml
#   eksctl create cluster -f cluster.rendered.yaml
# ===========================================================================
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: wsc-scaling-cluster
  region: ap-northeast-2
  version: "1.35"
  tags:
    karpenter.sh/discovery: wsc-scaling-cluster

# ----- 기존(Terraform 생성) VPC / Private Subnet 재사용 -----
vpc:
  id: "${VPC_ID}"
  subnets:
    private:
      wsc-scaling-sn-priv-a:
        id: "${PRIV_SUBNET_A}"
        az: ap-northeast-2a
      wsc-scaling-sn-priv-c:
        id: "${PRIV_SUBNET_C}"
        az: ap-northeast-2c
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

# ----- OIDC + IRSA ServiceAccount -----
# KEDA / Karpenter 컨트롤러가 SQS / EC2 권한을 IRSA 로 사용하도록 SA 를 사전 생성한다.
# helm 설치 시에는 serviceAccount.create=false 로 이 SA 를 재사용한다 (README 참조).
iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: keda-operator
        namespace: keda
      attachPolicyARNs:
        - "arn:aws:iam::${ACCOUNT_ID}:policy/wsc-scaling-keda-policy"
    - metadata:
        name: karpenter
        namespace: karpenter
      attachPolicyARNs:
        - "arn:aws:iam::${ACCOUNT_ID}:policy/wsc-scaling-karpenter-policy"

# ===========================================================================
# Managed Node Group (과제지 3. EKS 구성)
# - 단일 NodeGroup: name / nodegroupName / 노드 Name 모두 wsc-scaling-node
# - t3.medium, min 2 / max 10, label dedicated=scaling
# ===========================================================================
managedNodeGroups:
  - name: wsc-scaling-node
    amiFamily: AmazonLinux2023
    instanceType: t3.medium
    minSize: 2
    maxSize: 10
    desiredCapacity: 2
    privateNetworking: true
    volumeSize: 30
    volumeType: gp3
    volumeEncrypted: true
    labels:
      dedicated: scaling
    tags:
      Name: wsc-scaling-node
    ssh:
      enableSsm: true
    preBootstrapCommands:
      - "dnf -y install iputils bind-utils curl-minimal || true"
      - "echo 'ec2-user:Skill53##' | chpasswd"
      - "mkdir -p /etc/ssh/sshd_config.d && echo 'PasswordAuthentication yes' > /etc/ssh/sshd_config.d/60-wsc.conf"
      - "systemctl restart sshd"

# ----- 필수 Addon -----
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
