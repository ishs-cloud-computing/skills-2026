# Book App Deployment (요구사항 8 / 13)
# - ns unicorn, 컨테이너명 book, App NodeGroup(unicorn=app) 전용
# - replicas 2 + AZ topologySpread (HA), /health Liveness/Readiness
# - preStop + terminationGracePeriodSeconds 로 graceful shutdown
# - 환경변수는 ConfigMap(unicorn-config) 참조, IAM 은 Pod Identity(unicorn-book-app-sa)
# ${ECR} 은 terraform output ecr_repository_url 로 치환 (README step 7 렌더).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-book-app-deploy
  namespace: unicorn
  labels:
    app: unicorn-book-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unicorn-book-app
  template:
    metadata:
      labels:
        app: unicorn-book-app
    spec:
      serviceAccountName: unicorn-book-app-sa
      nodeSelector:
        unicorn: app
      # 노드 교체/배포 시 가용성 유지를 위한 graceful shutdown (요구사항 8)
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: unicorn-book-app
      containers:
        - name: book
          image: "${ECR}:v1.0.0"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: unicorn-config
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
