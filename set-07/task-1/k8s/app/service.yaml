# Book App Service (ClusterIP) — unicorn-tg(IP TargetGroup)가 이 Pod 들을 등록 (요구사항 8)
apiVersion: v1
kind: Service
metadata:
  name: unicorn-book-app-svc
  namespace: unicorn
spec:
  type: ClusterIP
  selector:
    app: unicorn-book-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
