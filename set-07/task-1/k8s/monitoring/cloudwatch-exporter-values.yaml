# ---------------------------------------------------------------------------
# Helm values: prometheus-community/prometheus-cloudwatch-exporter (요구사항 12)
# Book App HTTP Request Duration 패널 데이터 소스 = unicorn-alb TargetResponseTime(p50/p95/p99).
# SA cloudwatch-exporter 는 Pod Identity 로 unicorn-cwexporter-role 에 매핑(조회 권한).
# 설치:
#   helm upgrade --install cloudwatch-exporter prometheus-community/prometheus-cloudwatch-exporter \
#     -n monitoring -f cloudwatch-exporter-values.yaml
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: cloudwatch-exporter

nodeSelector:
  unicorn: addon

# kube-prometheus-stack Prometheus 가 스크랩하도록 ServiceMonitor 생성
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s

# IAM 자격증명은 Pod Identity 로 주입되므로 aws.role/secret 미지정
config: |-
  region: ap-northeast-2
  period_seconds: 60
  # 기본 600 이면 트래픽이 끊기고 12분 뒤 시계열이 사라져 패널이 No Data 가 된다.
  # 6h 를 보면 시드 한 번으로 경기 내내 마지막 데이터포인트를 계속 내보낸다.
  range_seconds: 21600
  set_timestamp: false
  metrics:
    - aws_namespace: AWS/ApplicationELB
      aws_metric_name: TargetResponseTime
      aws_dimensions: [LoadBalancer, TargetGroup]
      # 백분위수는 aws_statistics(Sum/Average/… enum)가 아니라 여기로 넣어야
      # aws_applicationelb_target_response_time_p50/p95/p99 시계열이 생긴다.
      aws_extended_statistics: [p50, p95, p99]
      # 기본 600 이면 [now-1200, now-600] 만 조회해 채점 직전 시드 트래픽이 안 잡힌다.
      delay_seconds: 120
    - aws_namespace: AWS/ApplicationELB
      aws_metric_name: RequestCount
      aws_dimensions: [LoadBalancer, TargetGroup]
      aws_statistics: [Sum]
