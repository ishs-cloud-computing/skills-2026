# ---------------------------------------------------------------------------
# Helm values: grafana-community/loki (과제지 4-4, 채점 4-3/4-5)
# - Single Binary 모드, chunks/index = filesystem(PVC 10Gi, gp3 SC) → PV 저장
# - allow_structured_metadata: true → OTLP Ingestion Endpoint(:3100/otlp) 활성화.
#   Loki 3.x 기본 OTLP 설정이 k8s.namespace.name/k8s.pod.name 을 인덱스 라벨로
#   승격한다 (채점 4-5 LogQL {k8s_namespace_name="o11y"}).
# - fullnameOverride 로 Service 이름 = o11y-loki ClusterIP:3100 (채점 4-3)
#
# 설치 (README):
#   helm repo add grafana-community https://grafana-community.github.io/helm-charts
#   helm upgrade --install o11y-loki grafana-community/loki -n monitoring \
#     --version 18.5.1 -f loki-values.yaml
# ---------------------------------------------------------------------------
fullnameOverride: o11y-loki

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp3

# SingleBinary 모드이므로 분산 컴포넌트/게이트웨이/캐시는 모두 비활성화
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: false
