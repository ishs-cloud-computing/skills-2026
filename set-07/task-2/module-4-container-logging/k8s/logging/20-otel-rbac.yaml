# k8sattributes 프로세서가 Pod 메타데이터를 조회할 수 있는 최소 RBAC (과제지 4-3)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: o11y-otel
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: o11y-otel
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: o11y-otel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: o11y-otel
subjects:
  - kind: ServiceAccount
    name: o11y-otel
    namespace: monitoring
