# TargetGroupBinding 이 이 Service 의 엔드포인트(Pod IP:8080)를 o11y-app-tg 에 등록한다.
apiVersion: v1
kind: Service
metadata:
  name: log-generator
  namespace: o11y
spec:
  type: ClusterIP
  selector:
    app: log-generator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
