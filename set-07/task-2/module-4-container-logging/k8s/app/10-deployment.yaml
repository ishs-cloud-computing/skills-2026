# ---------------------------------------------------------------------------
# log-generator (과제지 4-2, 채점 4-3/4-4)
# 제공 app.py 가 stdout 에 JSON 한 줄씩 찍는다 — OTel filelog 가 이 형식을 그대로 넘겨야
# Loki 에서 `| json` 이 동작한다.
# <ECR_IMAGE> 는 outputs.json 치환 토큰 (README 참조).
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: o11y
  labels:
    app: log-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: log-generator
          image: "<ECR_IMAGE>"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
