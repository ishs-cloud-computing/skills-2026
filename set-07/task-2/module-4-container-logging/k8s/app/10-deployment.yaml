# ---------------------------------------------------------------------------
# log-generator (과제지 4-2, 채점 4-3/4-4)
# - 초기 replicas 2, 8080 포트, stdout JSON 로그 출력 (제공 app.py)
# - <ECR_IMAGE> 는 apply 시 outputs.json 값으로 sed 치환 (README)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: o11y
  labels:
    app: log-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: log-generator
          image: "<ECR_IMAGE>"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
