# ===========================================================================
# eksctl Cluster Manifest — Container Logging (과제지 4, 채점 4-1)
# 적용: outputs.json 값을 env 로 export → envsubst 치환 → eksctl create (README 참조)
#
# 채점과 동일한 CloudShell 에서 생성한다. 생성자 신원 = 채점 신원이 자동 일치하므로
# 별도 자격증명 정렬(aws configure) 이 필요 없다.
# ===========================================================================
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER_NAME}
  region: ${REGION}
  version: "1.35"

# Auto Mode 명시적 비활성화: 관리형 노드그룹 + helm 애드온 설계.
autoModeConfig:
  enabled: false

# ----- 기존(Terraform 생성) VPC / Private Subnet 재사용 -----
vpc:
  id: "${VPC_ID}"
  subnets:
    private:
      o11y-subnet-priv-a:
        id: "${PRIV_SUBNET_A}"
        az: ap-northeast-1a
      o11y-subnet-priv-c:
        id: "${PRIV_SUBNET_C}"
        az: ap-northeast-1c
  # 채점(mark4.sh)·운영을 CloudShell 에서 kubectl 로 하므로 public 엔드포인트 필수.
  # private 는 노드 조인용 — 노드 SG 는 eksctl 이 cluster SG 에 자동 등록한다.
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

# ----- OIDC + IRSA ServiceAccount -----
# LBC 가 TargetGroupBinding 으로 Pod IP 를 TG 에 등록할 권한.
iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      attachPolicyARNs:
        - "${LBC_POLICY_ARN}"

# ===========================================================================
# NodeGroup (과제지 4-1 표, 채점 4-1)
# private 2AZ 배치로 채점 4-1 의 zone 2종을 만든다.
# NodeGroup 이름은 채점 대상이 아니다 (mark4.sh 가 nodegroups[0] 를 조회).
# ===========================================================================
managedNodeGroups:
  - name: o11y-ng
    amiFamily: AmazonLinux2023
    instanceType: t3.medium
    minSize: 2
    maxSize: 2
    desiredCapacity: 2
    privateNetworking: true
    volumeSize: 30
    volumeType: gp3
    volumeEncrypted: true
    instanceName: o11y-node
    # ALB -> Pod(8080/3000) 인바운드 허용 SG 부착 (terraform node_extra_sg)
    securityGroups:
      attachIDs:
        - "${NODE_EXTRA_SG_ID}"
    preBootstrapCommands:
      # 과제지 4-1 이 모든 노드 시간대를 KST 로 요구한다.
      - "ln -sf /usr/share/zoneinfo/Asia/Seoul /etc/localtime || true"
      - "timedatectl set-timezone Asia/Seoul || true"

# ----- 필수 Addon -----
# aws-ebs-csi-driver: Loki PV(gp3) 용. wellKnownPolicies 가 IRSA 역할을 만든다.
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
