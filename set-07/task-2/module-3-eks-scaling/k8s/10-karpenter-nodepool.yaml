# ---------------------------------------------------------------------------
# Karpenter EC2NodeClass / NodePool (과제지 3-5, 채점 3-5~3-7)
# taint dedicated=app:NoSchedule 로 App(toleration 보유)·DaemonSet 외 워크로드를 배제한다.
# 서브넷·SG 는 terraform 이 붙인 karpenter.sh/discovery·aws:eks:cluster-name 태그로 찾는다.
# <CLUSTER_NAME> / <KARPENTER_NODE_ROLE> 는 outputs.json 치환 토큰 (README 참조).
# ---------------------------------------------------------------------------
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: skm-app-nodeclass
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: "<KARPENTER_NODE_ROLE>"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<CLUSTER_NAME>"
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: "<CLUSTER_NAME>"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: skm-app-nodepool
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: skm-app-nodeclass
      taints:
        - key: dedicated
          value: app
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small", "t3.medium"]
      expireAfter: 720h
  # 500m x 5 Pod 는 노드 1대(t3.medium allocatable ~1.9 vCPU)에 다 들어가지 않아
  # 스케일아웃 시 노드가 2대 이상으로 늘어난다 (채점 3-6 Max App Nodes >= 2).
  limits:
    cpu: "16"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
