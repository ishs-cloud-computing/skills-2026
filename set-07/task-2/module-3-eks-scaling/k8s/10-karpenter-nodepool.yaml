# ---------------------------------------------------------------------------
# Karpenter EC2NodeClass / NodePool (과제지 3-5, 채점 3-5~3-7)
# - NodePool skm-app-nodepool / NodeClass skm-app-nodeclass (이름 정확 일치)
# - 허용 인스턴스: t3.small, t3.medium (채점은 sort join "t3.medium,t3.small")
# - taint dedicated=app:NoSchedule → App(toleration 보유)·DaemonSet 외 워크로드 배제
#   (채점 3-5: taints length >= 1)
# - Consolidation: WhenEmptyOrUnderutilized / 60s (유휴 노드 60초 후 반환)
# - subnet: karpenter.sh/discovery 태그(terraform private 서브넷)로 디스커버리
# - securityGroup: 클러스터 SG(aws:eks:cluster-name 태그)로 디스커버리
# - role: terraform 가 만든 KarpenterNodeRole-skm-eks-cluster
# ---------------------------------------------------------------------------
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: skm-app-nodeclass
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: "KarpenterNodeRole-skm-eks-cluster"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "skm-eks-cluster"
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: "skm-eks-cluster"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: skm-app-nodepool
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: skm-app-nodeclass
      taints:
        - key: dedicated
          value: app
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small", "t3.medium"]
      expireAfter: 720h
  # 500m x 5 Pod 는 노드 1대(t3.medium allocatable ~1.9 vCPU)에 다 들어가지 않아
  # 스케일아웃 시 노드가 2대 이상으로 늘어난다 (채점 3-6 Max App Nodes >= 2).
  limits:
    cpu: "16"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
