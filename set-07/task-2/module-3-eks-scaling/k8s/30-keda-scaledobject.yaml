# ---------------------------------------------------------------------------
# KEDA ScaledObject (과제지 3-4, 채점 3-4/3-6/3-7)
# - min 1 / max 5, 메시지 5건당 Pod 1개 (queueLength 5)
# - identityOwner: operator → keda-operator SA 의 IRSA(skm-keda-policy) 사용
# - 채점 3-7 은 purge 후 최대 2.5분 내 Pod 1 수렴을 요구한다:
#   pollingInterval 10 으로 빠르게 감지하고, HPA scaleDown stabilization 을
#   기본 300s → 30s 로 줄여 5→1 축소가 윈도 안에 끝나게 한다.
# - <SQS_URL> 은 apply 시 outputs.json 값으로 sed 치환 (README)
# ---------------------------------------------------------------------------
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-scaler
  namespace: skillsmkt
spec:
  scaleTargetRef:
    name: order-processor
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "<SQS_URL>"
        queueLength: "5"
        awsRegion: "ap-northeast-2"
        identityOwner: operator
