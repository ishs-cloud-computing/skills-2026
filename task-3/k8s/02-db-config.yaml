# user/product 공용 DB 접속 정보. <>는 README 런북의 sed로 치환.
# 당일 DB 엔진이 바뀌면(예: PostgreSQL) 키 이름은 새 과제지의 환경변수 표를 따라 수정.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
data:
  MYSQL_HOST: "<PROXY_ENDPOINT>" # RDS 직결이 아닌 프록시 (커넥션 풀링)
  MYSQL_PORT: "<DB_PORT>"
  MYSQL_DBNAME: "dev"
  MYSQL_USER: "admin"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
stringData:
  MYSQL_PASSWORD: "<DB_PASSWORD>"
---
# product 전용 (S3 이미지 업로드). db-config와 분리: S3_BUCKET 키 이름은
# 과제지에 없어 당일 바이너리 확인이 필요 — rename 시 검증된 DB 키를 건드리지 않게 격리.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  S3_BUCKET: "<BUCKET_NAME>" # terraform output bucket_name
  AWS_REGION: "ap-northeast-2"
