apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        # ── 인스턴스 타입: 바꾸려면 여기 값과 아래 limits만 교체 ────────────
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values: ["t3.medium"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        # 안정성: Spot 중단 없이 예측 가능하게 On-Demand 고정.
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand"]
  # 비용 캡. 앱 3종 × HPA max 10 × 250m = 7.5 vCPU 를 MNG 1대(약 1.2 vCPU 가용)와
  # 나눠 지고, Karpenter 노드마다 DaemonSet 오버헤드가 붙는 것을 감안해 t3.medium 6대분.
  limits:
    cpu: "12"
  # 유휴 시 Karpenter 노드를 0으로 회수한다 — "유휴 EC2 1대"의 나머지 절반
  # (다른 절반은 MNG를 min=max=1로 고정한 것).
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    # 자발적 중단(consolidation)은 한 번에 노드 1대까지
    budgets:
      - nodes: "1"
