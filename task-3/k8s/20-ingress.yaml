# ALB 라우팅 전체가 이 한 파일이다. AWS Load Balancer Controller가 이 Ingress를 보고
# ALB·타깃그룹·리스너 규칙·백엔드 SG 규칙을 전부 생성한다.
# 당일 API가 추가되면 여기 path 블록 하나 + k8s/1X-<app>.yaml 하나만 늘리면 된다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skills
  annotations:
    # terraform locals.tf의 alb_name과 반드시 같아야 한다 —
    # cloudfront.tf가 이 이름으로 ALB를 조회해 origin에 건다.
    alb.ingress.kubernetes.io/load-balancer-name: skills-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    # ip 모드: 파드 IP를 직접 타깃 등록 → NodePort 홉이 없어 지연이 낮다
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthcheck
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # 파드 종료 시 빠른 드레인 (Deployment의 preStop sleep 15와 정합)
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=15
    # 제공 API 외 경로 → 404 (과제 요구).
    # port name이 use-annotation이면 response-404 Service는 실재하지 않아도 된다.
    alb.ingress.kubernetes.io/actions.response-404: >
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"application/json","statusCode":"404","messageBody":"{\"error\":\"Not Found\"}"}}
    # 선택: ALB 직접 접근을 CloudFront로만 제한한다(엔드포인트 노출 방지).
    # 값은 terraform output cloudfront_prefix_list_id.
    # alb.ingress.kubernetes.io/security-group-prefix-lists: <PREFIX_LIST_ID>
spec:
  # LBC helm 차트가 만드는 IngressClass
  ingressClassName: alb
  defaultBackend:
    service:
      name: response-404
      port:
        name: use-annotation
  rules:
    - http:
        paths:
          - path: /v1/user
            pathType: Prefix
            backend:
              service:
                name: user
                port:
                  number: 80
          - path: /v1/product
            pathType: Prefix
            backend:
              service:
                name: product
                port:
                  number: 80
          - path: /v1/stress
            pathType: Prefix
            backend:
              service:
                name: stress
                port:
                  number: 80
