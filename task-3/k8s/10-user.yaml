# user API: DB-IO 바운드. 당일 API가 바뀌면 이 파일을 복사해 이름·이미지·env만 수정.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    app: user
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: user
      terminationGracePeriodSeconds: 45
      containers:
        - name: user
          image: <ECR_URL_USER>:v1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secret
          resources:
            requests:
              # demo 실측값 — t3.medium(allocatable ~1930m)에 2~3파드 패킹
              cpu: 600m
              memory: 768Mi
            limits:
              # CPU limit 없음: 스로틀링이 p99를 깎아 0.2s SLO를 해친다
              # memory request=limit: OOM 없이 예측 가능한 패킹 (demo 실측)
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            # TG deregistration_delay(15s) 동안 in-flight 요청 처리 후 종료
            preStop:
              exec:
                command: ["sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: user-svc
spec:
  type: ClusterIP
  selector:
    app: user
  ports:
    - port: 8080
      targetPort: 8080
---
# Terraform이 만든 타깃그룹에 파드 연결 (Auto Mode 내장 컨트롤러)
apiVersion: eks.amazonaws.com/v1
kind: TargetGroupBinding
metadata:
  name: user
spec:
  serviceRef:
    name: user-svc
    port: 8080
  targetGroupARN: "<TG_ARN_USER>"
  targetType: ip
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user
  minReplicas: 2
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    # T+60분에 트래픽이 스텝으로 들어오므로 스케일아웃은 즉시·공격적으로
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    # 스파이크 종료 후 빠른 회수로 비용 ratio를 낮춘다 (demo 검증값)
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user
