apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    app: user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: user
      terminationGracePeriodSeconds: 45
      containers:
        - name: user
          image: <IMAGE>
          ports:
            - containerPort: 8080
          # 키 이름은 과제지 환경변수 표와 정확히 일치해야 한다.
          env:
            - name: MYSQL_HOST
              value: "<DB_HOST>"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DBNAME
              value: "dev"
            - name: MYSQL_USER
              value: "admin"
            - name: MYSQL_PASSWORD
              value: "<DB_PASSWORD>"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            # CPU limit 을 두지 않는다 — CFS 스로틀링이 p99 를 깎아 0.2s SLO 를 해친다.
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: user
spec:
  type: ClusterIP
  selector:
    app: user
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # 스파이크 종료 후 한 스텝에 minReplicas 까지 내린다 — 50%씩 깎으면 10→1 에 4스텝
      # (~160초)이 걸리고 그동안 Karpenter 노드가 살아 있어 비용 ratio 평균을 끌어올린다.
      # stabilization 40s 는 유지한다 — 부하가 되돌아올 때 flapping 을 막는 유일한 가드다.
      stabilizationWindowSeconds: 40
      policies:
        - type: Percent
          value: 100
          periodSeconds: 40
