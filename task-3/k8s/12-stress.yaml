# stress API: CPU 바운드 (DB 미사용) — 노드 스케일아웃을 견인하는 워크로드.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress
  labels:
    app: stress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stress
  template:
    metadata:
      labels:
        app: stress
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: stress
      terminationGracePeriodSeconds: 45
      containers:
        - name: stress
          image: <ECR_URL_STRESS>:v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              # CPU limit 없음: burst 허용이 1.0s SLO에 유리
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: stress-svc
spec:
  type: ClusterIP
  selector:
    app: stress
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: eks.amazonaws.com/v1
kind: TargetGroupBinding
metadata:
  name: stress
spec:
  serviceRef:
    name: stress-svc
    port: 8080
  targetGroupARN: "<TG_ARN_STRESS>"
  targetType: ip
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stress
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stress
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: stress
