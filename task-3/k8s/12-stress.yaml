# stress API: CPU 바운드 (DB 미사용) — 노드 스케일아웃을 견인하는 워크로드.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress
  labels:
    app: stress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stress
  template:
    metadata:
      labels:
        app: stress
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: stress
      terminationGracePeriodSeconds: 45
      containers:
        - name: stress
          image: <ECR_URL_STRESS>:v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              # demo 실측값 — t3.medium(allocatable ~1930m)에 2~3파드 패킹
              cpu: 600m
              memory: 768Mi
            limits:
              # CPU limit 없음: burst 허용이 1.0s SLO에 유리
              # memory request=limit: OOM 없이 예측 가능한 패킹 (demo 실측)
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: stress-svc
spec:
  type: ClusterIP
  selector:
    app: stress
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: eks.amazonaws.com/v1
kind: TargetGroupBinding
metadata:
  name: stress
spec:
  serviceRef:
    name: stress-svc
    port: 8080
  targetGroupARN: "<TG_ARN_STRESS>"
  targetType: ip
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stress
  minReplicas: 2
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    # 스파이크 종료 후 빠른 회수로 비용 ratio를 낮춘다 (demo 검증값)
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stress
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: stress
