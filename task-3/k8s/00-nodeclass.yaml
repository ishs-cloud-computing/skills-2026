apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: KarpenterNodeRole-skills-eks
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: skills-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: skills-eks
  # eksctl/cluster.yaml 의 amiFamily 와 같은 계열이어야 노드 OS 가 갈리지 않는다.
  amiSelectorTerms:
    - alias: bottlerocket@latest
