# product API: DB-IO 바운드 + S3 이미지 업로드 (Pod Identity → product-app-sa).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels:
    app: product
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      serviceAccountName: product-app-sa # eksctl pod identity association
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: product
      terminationGracePeriodSeconds: 45
      containers:
        - name: product
          image: <ECR_URL_PRODUCT>:v1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secret
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              # CPU limit 없음: 스로틀링이 p99를 깎아 0.2s SLO를 해친다
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: product-svc
spec:
  type: ClusterIP
  selector:
    app: product
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: eks.amazonaws.com/v1
kind: TargetGroupBinding
metadata:
  name: product
spec:
  serviceRef:
    name: product-svc
    port: 8080
  targetGroupARN: "<TG_ARN_PRODUCT>"
  targetType: ip
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: product
