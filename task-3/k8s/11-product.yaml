apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels:
    app: product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      serviceAccountName: product
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: product
      terminationGracePeriodSeconds: 45
      containers:
        - name: product
          image: "600440344359.dkr.ecr.ap-northeast-2.amazonaws.com/product:v1"
          ports:
            - containerPort: 8080
          # 키 이름은 과제지 환경변수 표와 정확히 일치해야 한다.
          env:
            - name: MYSQL_HOST
              value: "skills-db-proxy.proxy-creegaqoksh3.ap-northeast-2.rds.amazonaws.com"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DBNAME
              value: "dev"
            - name: MYSQL_USER
              value: "admin"
            - name: MYSQL_PASSWORD
              value: "password"
            # S3 버킷·리전의 env 키 이름은 과제지에 없다 — 당일 바이너리로 확인해야 한다.
            - name: S3_BUCKET
              value: "wsc2026-task3-images-103"
            - name: AWS_REGION
              value: "ap-northeast-2"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            # CPU limit 을 두지 않는다 — CFS 스로틀링이 p99 를 깎아 0.2s SLO 를 해친다.
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: product
spec:
  type: ClusterIP
  selector:
    app: product
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 40
      policies:
        - type: Percent
          value: 50
          periodSeconds: 40
