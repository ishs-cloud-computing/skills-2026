# product API: DB-IO 바운드 + S3 이미지 업로드 (Pod Identity → product-app-sa).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels:
    app: product
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      serviceAccountName: product-app-sa # eksctl pod identity association
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: product
      terminationGracePeriodSeconds: 45
      containers:
        - name: product
          image: <ECR_URL>:v1
          ports:
            - containerPort: 8080
          # <>는 README 8번 sed로 치환. DB 키는 과제지 표와 일치.
          env:
            - name: MYSQL_HOST
              value: "<PROXY_ENDPOINT>"
            - name: MYSQL_PORT
              value: "<DB_PORT>"
            - name: MYSQL_DBNAME
              value: "dev"
            - name: MYSQL_USER
              value: "admin"
            - name: MYSQL_PASSWORD
              value: "<DB_PASSWORD>"
            # S3 버킷·리전 키 이름은 과제지에 없음 → 당일 바이너리 확인 필수.
            # 다르면 이 두 줄만 고치고 kubectl rollout restart deploy product.
            - name: S3_BUCKET
              value: "<BUCKET_NAME>"
            - name: AWS_REGION
              value: "ap-northeast-2"
          resources:
            requests:
              # demo 실측값 — t3.medium(allocatable ~1930m)에 2~3파드 패킹
              cpu: 600m
              memory: 768Mi
            limits:
              # CPU limit 없음: 스로틀링이 p99를 깎아 0.2s SLO를 해친다
              # memory request=limit: OOM 없이 예측 가능한 패킹 (demo 실측)
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: product-svc
spec:
  type: ClusterIP
  selector:
    app: product
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: eks.amazonaws.com/v1
kind: TargetGroupBinding
metadata:
  name: product
spec:
  serviceRef:
    name: product-svc
    port: 8080
  targetGroupARN: "<TG_ARN>"
  targetType: ip
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product
  minReplicas: 2
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    # 스파이크 종료 후 빠른 회수로 비용 ratio를 낮춘다 (demo 검증값)
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: product
