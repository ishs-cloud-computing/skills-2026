# product API: DB-IO 바운드 + S3 이미지 업로드.
# ServiceAccount 'product'는 eksctl podIdentityAssociations가 만든다(S3 권한 포함).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels:
    app: product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      serviceAccountName: product
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: product
      terminationGracePeriodSeconds: 45
      containers:
        - name: product
          image: <IMAGE> # terraform output ecr_image_uris로 치환 (태그 포함, README STEP 6)
          ports:
            - containerPort: 8080
          # <>는 README STEP 6에서 치환. DB 키는 과제지 표와 일치.
          env:
            - name: MYSQL_HOST
              value: "<PROXY_ENDPOINT>"
            - name: MYSQL_PORT
              value: "<DB_PORT>"
            - name: MYSQL_DBNAME
              value: "dev"
            - name: MYSQL_USER
              value: "admin"
            - name: MYSQL_PASSWORD
              value: "<DB_PASSWORD>"
            # S3 버킷·리전 키 이름은 과제지에 없음 → 당일 바이너리 확인 필수.
            # 다르면 이 두 줄만 고치고 kubectl rollout restart deploy product.
            - name: S3_BUCKET
              value: "<BUCKET_NAME>"
            - name: AWS_REGION
              value: "ap-northeast-2"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # CPU limit 없음: 스로틀링이 p99를 깎아 0.2s SLO를 해친다
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: product
spec:
  type: ClusterIP
  selector:
    app: product
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 40
      policies:
        - type: Percent
          value: 50
          periodSeconds: 40
