apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: skills-eks
  region: ap-northeast-2
  version: "1.36"

# Terraform이 만든 private 서브넷 사용 (README 런북 STEP 2에서 치환)
vpc:
  subnets:
    private:
      ap-northeast-2a: { id: subnet-REPLACE_A }
      ap-northeast-2b: { id: subnet-REPLACE_B }

autoModeConfig:
  enabled: true
  nodePools: [] # 내장 general-purpose/system 둘 다 비활성화 → default NodeClass도 생성 안 됨

# 커스텀 NodeClass가 쓸 노드 역할에 EC2 액세스 엔트리 부여.
# (내장 NodePool을 껐으므로 EKS가 자동으로 만들어주지 않는다.)
accessConfig:
  accessEntries:
    - principalARN: arn:aws:iam::ACCOUNT_ID:role/skills-eks-automode-node # = terraform output automode_node_role_arn
      type: EC2
      accessPolicies:
        - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSAutoNodePolicy
          accessScope:
            type: cluster

addons:
  # HPA 전제조건 (Auto Mode에 미포함) — EKS community addon
  - name: metrics-server
  # 모니터링(Container Insights) + 로깅(앱 stdout/stderr → CloudWatch Logs)
  - name: amazon-cloudwatch-observability
    podIdentityAssociations:
      - namespace: amazon-cloudwatch
        serviceAccountName: cloudwatch-agent
        permissionPolicyARNs:
          - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

# Pod Identity — Auto Mode는 에이전트가 내장이라 addon 불필요.
iam:
  podIdentityAssociations:
    - namespace: default
      serviceAccountName: product-app-sa
      createServiceAccount: true
      permissionPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
