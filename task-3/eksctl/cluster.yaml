apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: skills-eks
  region: ap-northeast-2
  version: "1.36"

autoModeConfig:
  enabled: false

vpc:
  subnets:
    private:
      ap-northeast-2a: { id: subnet-REPLACE_PRIVATE_A }
      ap-northeast-2b: { id: subnet-REPLACE_PRIVATE_B }
    public:
      ap-northeast-2a: { id: subnet-REPLACE_PUBLIC_A }
      ap-northeast-2b: { id: subnet-REPLACE_PUBLIC_B }

iam:
  podIdentityAssociations:
    - namespace: default
      serviceAccountName: product
      createServiceAccount: true
      permissionPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

managedNodeGroups:
  - name: system
    instanceType: t3.medium
    # k8s/00-nodeclass.yaml 의 amiSelectorTerms alias 와 같은 계열이어야 노드 OS 가 갈리지 않는다.
    amiFamily: Bottlerocket
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    privateNetworking: true

addons:
  - name: metrics-server
  - name: eks-pod-identity-agent
  # 일반 버전: 전 네임스페이스 로그 + Application Signals 까지 기본값 그대로.
  # 수집 범위를 줄이려면 클러스터 생성 후 eksctl/cloudwatch-tuned.yaml 을 적용한다.
  - name: amazon-cloudwatch-observability
    podIdentityAssociations:
      - namespace: amazon-cloudwatch
        serviceAccountName: cloudwatch-agent
        permissionPolicyARNs:
          - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
          - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
