# plan.md §3.5 — 배포 전 envsubst 로 ${...} 치환 (README 런북 4단계)
# 필요한 환경 변수: VPC_ID, SUBNET_A_ID, SUBNET_B_ID, EKS_KMS_ARN, NODE_SHARED_SG_ID,
#   BOOK_APP_POLICY_ARN, GRAFANA_POLICY_ARN, FLUENTBIT_POLICY_ARN, LBC_POLICY_ARN,
#   NODE_PTC_POLICY_ARN, ACCOUNT_ID, BOOTSTRAP_USERDATA_ADDON, BOOTSTRAP_USERDATA_APP
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: gj2026-eks-cluster
  region: ap-northeast-2
  version: "1.35"

vpc:
  id: "${VPC_ID}"
  subnets:
    private:
      ap-northeast-2a: { id: "${SUBNET_A_ID}" }
      ap-northeast-2b: { id: "${SUBNET_B_ID}" }
  # 채점 4-1: public/private 둘 다 True. CloudShell kubectl 동작에도 public 필수
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

# 채점 4-1 두 번째 줄: secret 봉투 암호화 CMK
secretsEncryption:
  keyARN: "${EKS_KMS_ARN}"

# IRSA — 역할 이름을 명시 생성, 정책은 Terraform 산출물(attachPolicyARNs)
# (OIDC provider 가 클러스터 생성 후에야 존재하므로 역할 생성을 eksctl 에 위임)
iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: book-sa
        namespace: skills
      roleName: gj2026-book-app-role   # DynamoDB Deny 정책의 예외 principal 과 정확히 일치해야 함
      attachPolicyARNs: ["${BOOK_APP_POLICY_ARN}"]
    - metadata:
        name: grafana
        namespace: monitoring
      roleName: gj2026-grafana-role
      attachPolicyARNs: ["${GRAFANA_POLICY_ARN}"]
    - metadata:
        name: aws-for-fluent-bit
        namespace: logging
      roleName: gj2026-fluentbit-role
      attachPolicyARNs: ["${FLUENTBIT_POLICY_ARN}"]
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      roleName: gj2026-lbc-role
      attachPolicyARNs: ["${LBC_POLICY_ARN}"]

addons:
  - name: vpc-cni
  - name: kube-proxy
  - name: coredns
    # Deployment 형 애드온은 addon 노드로 유도 (스키마는 버전별 상이 — README 런북 참고)
    configurationValues: |-
      nodeSelector:
        role: addon
  - name: metrics-server
    configurationValues: |-
      nodeSelector:
        role: addon

managedNodeGroups:
  # ---------- addon: t3.medium x2, taint 없음(광역 컴포넌트 수용) ----------
  - name: gj2026-eks-addon-nodegroup
    amiFamily: Bottlerocket        # ami: 지정 금지 — amiType 이 CUSTOM 이 되어 4-2 실패
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: true
    labels: { role: addon }
    instanceName: gj2026-eks-addon-node   # EC2 Name 태그 (채점 4-2)
    securityGroups:
      attachIDs: ["${NODE_SHARED_SG_ID}"]
    iam:
      attachPolicyARNs:
        # eksctl 기본 정책 + PTC import (attachPolicyARNs 지정 시 기본값이 사라지므로 전부 명시)
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - "${NODE_PTC_POLICY_ARN}"
    # 채점 4-3: bootstrap container 가 kubelet 이전에 hostname-override 를 심는다 (plan.md §3.5.1)
    bottlerocket:
      settings:
        bootstrap-containers:
          set-hostname:
            source: "${ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/gj2026/br-bootstrap:1.0.0"
            mode: once          # 1회 실행 후 자동 off
            essential: true     # 실패 시 부팅 중단 — 잘못된 이름의 노드가 조인하지 않음
            user-data: "${BOOTSTRAP_USERDATA_ADDON}"

  # ---------- app: m5.large x2, 전용 taint(book 외 배치 금지, 요구 7) ----------
  # m5.large 는 trunk ENI 지원 → SecurityGroupPolicy 적용 가능 (t 패밀리는 미지원)
  - name: gj2026-eks-app-nodegroup
    amiFamily: Bottlerocket
    instanceType: m5.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: true
    labels: { role: app }
    taints:
      - key: dedicated
        value: app
        effect: NoSchedule
    instanceName: gj2026-eks-app-node
    securityGroups:
      attachIDs: ["${NODE_SHARED_SG_ID}"]
    iam:
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - "${NODE_PTC_POLICY_ARN}"
    bottlerocket:
      settings:
        bootstrap-containers:
          set-hostname:
            source: "${ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/gj2026/br-bootstrap:1.0.0"
            mode: once
            essential: true
            user-data: "${BOOTSTRAP_USERDATA_APP}"
