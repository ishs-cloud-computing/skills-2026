# KEDA ScaledObject + TriggerAuthentication (과제지 6-6, 채점 4-4 직접 조회)
# - min 0 / max 6, queueLength 2 → 12건 발송 시 6 pod (채점 4-6).
# - pollingInterval 15: min=0 이라 0→1 활성화는 KEDA operator 직접 폴링 —
#   과제지 상한(15초 이하) 그대로. (set-07 은 min=1 이라 삭제했던 필드)
# - podIdentity aws-eks: 채점 4-4 가 provider 문자열을 aws-eks 로 검사한다
#   (2026-08-07 정정). KEDA 는 aws-eks 를 deprecated 로 두고 v3 에서 제거 예정이나
#   2.20 까지는 유효하다.
# - identityOwner operator 필수: aws-eks 경로의 기본값(pod)은 스케일 대상 SA
#   (sqs-worker-sa)의 역할을 sts:AssumeRole 하려 든다. 그 역할의 신뢰 정책은 OIDC
#   (AssumeRoleWithWebIdentity)만 신뢰하므로 403 → ScaledObject READY=False →
#   메트릭이 없어 파드가 1개로 고정된다(이슈 #136). operator 로 두면 keda-operator
#   자신의 IRSA(skills-sqs-keda-policy)로 조회해 AssumeRole 경로가 사라진다.
#   provider 를 aws 로 되돌리는 것은 4-4 를 잃으므로 해법이 아니다.
# ${QUEUE_URL} ${REGION} 은 README 5단계에서 치환.
# ---------------------------------------------------------------------------
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: sqs-worker-trigger-auth
  namespace: skills-sqs
spec:
  podIdentity:
    provider: aws-eks
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sqs-worker-scaledobject
  namespace: skills-sqs
spec:
  scaleTargetRef:
    name: sqs-worker
  minReplicaCount: 0
  maxReplicaCount: 6
  pollingInterval: 15
  cooldownPeriod: 30
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: sqs-worker-trigger-auth
      metadata:
        queueURL: "${QUEUE_URL}"
        queueLength: "2"
        awsRegion: "${REGION}"
        identityOwner: operator
