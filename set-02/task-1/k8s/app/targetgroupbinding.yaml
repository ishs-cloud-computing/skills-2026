# TargetGroupBinding (AWS LB Controller CRD): wskorea26-book-tg(IP TG)에 Pod IP 등록.
# CloudFront(/book*) -> wskorea26-book-alb -> wskorea26-book-tg -> Book App Pod:8080
# <APP_TARGET_GROUP_ARN> 은 terraform output app_target_group_arn 으로 치환 (README).
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: wskorea26-book-tgb
  namespace: wskorea26
spec:
  serviceRef:
    name: wskorea26-book-svc
    port: 8080
  targetGroupARN: "<APP_TARGET_GROUP_ARN>"
  targetType: ip
