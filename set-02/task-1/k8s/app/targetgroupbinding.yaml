# TargetGroupBinding (AWS LB Controller CRD): wskorea26-book-tg(IP TG)에 Pod IP 등록.
# CloudFront(/book*) -> wskorea26-book-alb -> wskorea26-book-tg -> Book App Pod:8080
# ${APP_TG} 는 terraform output app_target_group_arn ($env:APP_TG) 로 치환 (README §5 렌더).
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: wskorea26-book-tgb
  namespace: wskorea26
spec:
  serviceRef:
    name: wskorea26-book-svc
    port: 8080
  targetGroupARN: "${APP_TG}"
  targetType: ip
