# ---------------------------------------------------------------------------
# Helm values: prometheus-community/kube-prometheus-stack (요구사항 12)
# release name: wskorea26-monitoring / namespace: monitoring
# - 모든 모니터링 컴포넌트는 Addon NodeGroup(node-type=addon) 에 배치 (요구사항 12)
# - 관리형 Control Plane 미노출 컴포넌트(controllerManager/scheduler/etcd/proxy) 수집 비활성
# - 스토리지는 emptyDir(기본값): EBS CSI 를 설치하면 csi-node DaemonSet 이 app 노드에
#   떠서 mark 5-4 를 위반하므로 PVC 를 쓰지 않는다 (대회 기간 내 retention 6h 로 충분)
# - <GRAFANA_ADMIN_USER>/<GRAFANA_ADMIN_PASSWORD> 는 설치 시 sed 로 치환 (README)
# 설치:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install wskorea26-monitoring prometheus-community/kube-prometheus-stack \
#     --version <핀 버전> -n monitoring -f <치환된 values>
# ---------------------------------------------------------------------------

# Alertmanager 미사용: 요구 패널(메트릭 시각화)에 불필요하고, 활성화 시 nodeSelector
# 없는 StatefulSet 이 app 노드에 스케줄될 수 있다 (요구사항 12: 모니터링은 addon NG)
alertmanager:
  enabled: false

# EKS 관리형 Control Plane 은 해당 메트릭을 노출하지 않으므로 ServiceMonitor 비활성
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  nodeSelector:
    node-type: addon
  admissionWebhooks:
    patch:
      nodeSelector:
        node-type: addon

prometheus:
  prometheusSpec:
    nodeSelector:
      node-type: addon
    retention: 6h
    # 모든 ServiceMonitor/PodMonitor 를 release 라벨 없이도 수집
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# node-exporter(DaemonSet)도 Addon NodeGroup 으로 제한 (요구사항 12: 모니터링
# 컴포넌트는 addon NG). 필수 5개 패널은 kubelet cAdvisor + kube-state-metrics
# 메트릭 기반이라 app 노드 상주 에이전트가 필요 없다.
prometheus-node-exporter:
  nodeSelector:
    node-type: addon

# Pod/오브젝트 상태 메트릭 (실행 중 Pod 수 / 재시작 횟수 패널)
kube-state-metrics:
  nodeSelector:
    node-type: addon

# ----- Grafana (요구사항 12) -----
grafana:
  nodeSelector:
    node-type: addon
  adminUser: "<GRAFANA_ADMIN_USER>"
  adminPassword: "<GRAFANA_ADMIN_PASSWORD>"
  # wskorea26-grafana-tg(IP TG)가 Pod:3000 을 등록하므로 Service 포트를 3000 으로 노출
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  # 대시보드는 ConfigMap(label: grafana_dashboard) sidecar 로 provisioning
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: monitoring
    datasources:
      defaultDatasourceEnabled: false
  # Prometheus datasource — dashboard.json 의 datasource uid(prometheus)와 일치해야 함
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      access: proxy
      url: http://prometheus-operated.monitoring.svc:9090
      isDefault: true
