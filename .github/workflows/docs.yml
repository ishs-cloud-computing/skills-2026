# set-06/task-1 설계 문서 사이트 → GitHub Pages (plan.md §8)
# site/ 변경 시에만 트리거 — 다른 세트 작업과 분리
name: docs

on:
  push:
    branches: [main, set-06/task-1]
    paths: ["set-06/task-1/site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # install + build + Pages 아티팩트 업로드까지 일괄 수행
      - uses: withastro/action@v6
        with:
          path: set-06/task-1/site
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
