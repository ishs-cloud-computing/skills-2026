name: 2과제 모듈 (서브)
description: 2과제 모듈 1개당 서브 이슈. 모듈 수는 세트마다 다르므로 모듈마다 따로 만든다.
title: "[set-XX/task-2 module-X] "
labels: ["task-2"]
body:
  - type: markdown
    attributes:
      value: |
        2과제는 독립 모듈 여러 개로 구성. 모듈 1개당 이 서브 이슈를 1개씩 만들어
        부모 세트 트래킹 이슈에 연결한다.

  - type: input
    id: parent
    attributes:
      label: 부모 이슈
      description: 세트 트래킹 이슈 번호
      placeholder: "#"
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: 모듈
      description: 모듈 번호 / 이름
      placeholder: module-1
    validations:
      required: true

  - type: textarea
    id: stack
    attributes:
      label: 사용 스택
      description: 이 모듈에서 쓰는 주요 서비스 / 스택
      placeholder: 리전, 사용 서비스 ...
    validations:
      required: false

  - type: textarea
    id: checklist
    attributes:
      label: 진행 체크리스트
      description: 모듈에 필요한 하위 디렉토리만 남긴다 (terraform/ eksctl/ manifests/ app-source/ 중).
      value: |
        - [ ] terraform
        - [ ] eksctl
        - [ ] k8s / manifests
        - [ ] app-source
        - [ ] mark.sh
    validations:
      required: true
