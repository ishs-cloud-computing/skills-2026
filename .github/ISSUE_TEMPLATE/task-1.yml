name: 1과제 (서브)
description: 1과제 작업 서브 이슈 (세트당 1개). 부모 세트 트래킹 이슈에 연결한다.
title: "[set-XX/task-1] "
labels: ["task-1"]
body:
  - type: markdown
    attributes:
      value: |
        1과제는 보통 단일 리전 종합 인프라. 부모 세트 트래킹 이슈의 서브 이슈로 만든다.

  - type: input
    id: parent
    attributes:
      label: 부모 이슈
      description: 세트 트래킹 이슈 번호
      placeholder: "#"
    validations:
      required: true

  - type: textarea
    id: stack
    attributes:
      label: 사용 스택
      description: 이 과제에서 쓰는 주요 서비스 / 스택
      placeholder: EKS, ALB, CloudFront, WAF, Lambda, DynamoDB, S3 ...
    validations:
      required: false

  - type: textarea
    id: checklist
    attributes:
      label: 진행 체크리스트
      description: 실제 구성에 맞게 자유롭게 추가/삭제한다.
      value: |
        - [ ] terraform
        - [ ] eksctl
        - [ ] k8s
        - [ ] app
        - [ ] mark.sh
    validations:
      required: true
