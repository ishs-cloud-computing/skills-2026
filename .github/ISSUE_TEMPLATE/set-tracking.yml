name: 세트 트래킹 (부모)
description: 세트별 진행 상황 추적 부모 이슈 (세트당 1개). 실제 작업은 서브 이슈로 분리한다.
title: "[set-XX] "
labels: ["set-tracking"]
body:
  - type: markdown
    attributes:
      value: |
        세트 하나당 부모 이슈 하나. 실제 작업은 1과제 / 2과제 모듈별 **서브 이슈**로 나눠 만들고
        여기서는 개요와 서브 이슈 링크만 관리한다.
        기간 트랙은 본문에 적지 말고 Project 필드 / 이 이슈가 속한 Milestone(=세트)로 관리한다.

  - type: input
    id: board
    attributes:
      label: 게시판 주소
      description: 해당 과제 공개 게시판 / 공지 글 URL
      placeholder: https://...
    validations:
      required: false

  - type: textarea
    id: stack
    attributes:
      label: 사용 스택
      description: 이 세트에서 쓰는 주요 서비스 / 스택 요약
      placeholder: |
        - 1과제: EKS, ALB, CloudFront, WAF, Lambda, DynamoDB, S3 ...
        - 2과제 module-1: ...
        - 2과제 module-2: ...
    validations:
      required: false
