# ===========================================================================
# eksctl Cluster Manifest (요구사항 7)
# 적용: 본 PC 에서 terraform outputs 로 ${...} 플레이스홀더를 치환해 렌더 후 create 한다.
#   렌더/변수 목록: ../README.md step 3 (PowerShell) 또는 ../README.linux.md step 3 (bash)
#   eksctl create cluster -f cluster.rendered.yaml
# fully-private 여도 생성은 본 PC 에서 가능 — eksctl 이 생성 중 퍼블릭 엔드포인트를
# 임시로 켰다가 완료 시 닫는다. 생성 후 kubectl 은 VPC CloudShell 에서만 된다.
# 주의: eksctl 은 terraform 과 같은 자격증명으로 실행한다 (wsc2026-eks-kms
#       키 정책이 배포자 신원에만 CreateGrant 를 허용 — 유의사항 10).
# ===========================================================================
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: wsc2026-eks-cluster
  region: ap-northeast-2
  version: "1.35"

# Auto Mode 미사용 (직접 정의한 managed nodegroup 으로 운용)
autoModeConfig:
  enabled: false

# 인증 모드 = EKS Access Entry (aws-auth ConfigMap 미사용)
accessConfig:
  authenticationMode: API
  bootstrapClusterCreatorAdminPermissions: true

# ----- 기존(Terraform 생성) VPC / Private Subnet 재사용 -----
vpc:
  id: "${VPC_ID}"
  # control plane ENI 추가 SG (mark-sg CloudShell → private API 443 인바운드 허용)
  securityGroup: "${CP_EXTRA_SG_ID}"
  # 공용 노드 SG (wsc2026-app-alb → Pod 8080). managed NG 에는 자동 attach 되지 않아
  # 각 NG 의 attachIDs 로 직접 부착하고, 이 필드는 eksctl 이 자체 shared SG 를
  # 새로 만들지 않게 하는 용도다.
  sharedNodeSecurityGroup: "${NODE_SHARED_SG_ID}"
  subnets:
    private:
      wsc2026-skills-app-sub-a:
        id: "${PRIV_SUBNET_A}"
        az: ap-northeast-2a
      wsc2026-skills-app-sub-b:
        id: "${PRIV_SUBNET_B}"
        az: ap-northeast-2b

# Fully Private: Control Plane 퍼블릭 엔드포인트 차단 (요구사항 7, mark 4-1).
# VPC Endpoint 는 만들지 않는다(skipEndpointCreation) — app 서브넷의 NAT 로
# eks-auth(Pod Identity)·노드 부트스트랩·이미지 풀 통신이 가능하다.
privateCluster:
  enabled: true
  skipEndpointCreation: true

# Secret 리소스 KMS Envelope 암호화 = wsc2026-eks-kms (요구사항 7)
secretsEncryption:
  keyARN: "${EKS_KMS_ARN}"

# Control Plane 모든 로그 → CloudWatch Logs (요구사항 7, mark 4-1)
cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]

# ----- EKS Pod Identity 연동 (요구사항 8) -----
# 역할은 Terraform 이 생성(trust=pods.eks.amazonaws.com, 본 클러스터 한정).
# 여기서는 association 만 연결한다.
iam:
  podIdentityAssociations:
    - namespace: wsc2026
      serviceAccountName: wsc2026-book-sa
      roleARN: "${BOOK_POD_ROLE_ARN}"
    - namespace: kube-system
      serviceAccountName: aws-load-balancer-controller
      roleARN: "${LBC_ROLE_ARN}"
    - namespace: observability
      serviceAccountName: fluent-bit
      roleARN: "${FLUENTBIT_ROLE_ARN}"
    # Grafana CloudWatch 데이터소스 인증 (SA 이름은 kps values 에서 고정)
    - namespace: observability
      serviceAccountName: monitoring-grafana
      roleARN: "${GRAFANA_ROLE_ARN}"

# ===========================================================================
# Managed Node Groups (요구사항 7)
# - Addon NG(관측성 등 시스템 구성 요소) / Workload NG(애플리케이션 전용)
# - kubelet clusterDomain 을 wsc2026.skills.local 로 변경 — CoreDNS Corefile 패치
#   (k8s/01-coredns-wsc2026.yaml)와 짝을 이룬다. AL2023 은 overrideBootstrapCommand
#   에 nodeadm NodeConfig 를 넣으면 MNG 기본 NodeConfig 와 필드 단위 merge 된다
#   (eksctl v0.199.0+ 네이티브 AMI MNG 지원).
# ===========================================================================
managedNodeGroups:
  # ---------- Addon NodeGroup: label wsc2026/node=addon ----------
  - name: wsc2026-addon-nodegroup
    amiFamily: AmazonLinux2023
    instanceType: t3.medium
    minSize: 2
    maxSize: 4
    desiredCapacity: 2
    privateNetworking: true
    volumeSize: 40
    volumeType: gp3
    volumeEncrypted: true
    disableIMDSv1: true
    labels:
      wsc2026/node: addon
    # managed NG 는 tags.Name 을 쓰면 LT TagSpecifications 에 eksctl 기본 Name 과
    # 중복 등록되어 기본값이 적용된다. instanceName 으로 정확히 지정한다.
    instanceName: wsc2026-addon-node
    securityGroups:
      attachIDs:
        - "${NODE_SHARED_SG_ID}"
    overrideBootstrapCommand: |
      apiVersion: node.eks.aws/v1alpha1
      kind: NodeConfig
      spec:
        kubelet:
          config:
            clusterDomain: wsc2026.skills.local

  # ---------- Workload NodeGroup: label wsc2026/node=application ----------
  # 데몬셋 제외 애플리케이션 전용 (요구사항 7) → taint 로 다른 워크로드 차단.
  - name: wsc2026-workload-ng
    amiFamily: AmazonLinux2023
    instanceType: t3.medium
    minSize: 2
    maxSize: 4
    desiredCapacity: 2
    privateNetworking: true
    volumeSize: 30
    volumeType: gp3
    volumeEncrypted: true
    disableIMDSv1: true
    labels:
      wsc2026/node: application
    taints:
      - key: wsc2026/node
        value: application
        effect: NoSchedule
    instanceName: wsc2026-workload-node
    securityGroups:
      attachIDs:
        - "${NODE_SHARED_SG_ID}"
    overrideBootstrapCommand: |
      apiVersion: node.eks.aws/v1alpha1
      kind: NodeConfig
      spec:
        kubelet:
          config:
            clusterDomain: wsc2026.skills.local

# ----- Addon -----
# eks-pod-identity-agent 는 Pod Identity 필수. 버전은 지정하지 않는다 — eksctl 이
# 클러스터 버전의 default addon 버전을 설치한다 (작업 규칙 2: EKS Addon 버전 미고정).
addons:
  - name: eks-pod-identity-agent
  - name: vpc-cni
  - name: kube-proxy
  # coredns(Deployment 형 Addon)는 Addon NodeGroup 에 배치.
  # 도메인 변경은 addon 설정이 아닌 Corefile 패치로 수행 (k8s/01-coredns-wsc2026.yaml)
  # — addon 업데이트 시 Corefile 이 되돌아갈 수 있으므로 패치 후 grep 재확인.
  - name: coredns
    configurationValues: |
      {"nodeSelector": {"wsc2026/node": "addon"}}
