# CoreDNS Corefile 패치 (요구사항 7): kubernetes 플러그인 존을 cluster.local →
# wsc2026.skills.local 로 변경 (mark 4-1 이 Corefile 을 grep).
# kubelet clusterDomain 은 eksctl overrideBootstrapCommand(nodeadm NodeConfig)로
# 동일하게 변경되어 있어 파드 search 도메인과 일치한다.
# 적용 후: kubectl -n kube-system rollout restart deploy/coredns
# 주의: coredns addon 업데이트 시 Corefile 이 기본값으로 되돌아갈 수 있다 → 재적용.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        kubernetes wsc2026.skills.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }