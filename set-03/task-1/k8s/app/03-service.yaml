# Book App Service (요구사항 8)
# - port 80 → 8080 (mark 11-1 이 http://<ClusterIP>/ 기본 포트 80 으로 트래픽 생성)
# - trafficDistribution: PreferClose — 동일 AZ Pod 우선 라우팅으로 Cross-AZ 비용 절감
apiVersion: v1
kind: Service
metadata:
  name: wsc2026-book-svc
  namespace: wsc2026
  labels:
    app: wsc2026-book
spec:
  type: ClusterIP
  selector:
    app: wsc2026-book
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  trafficDistribution: PreferClose
