# ---------------------------------------------------------------------------
# Prometheus Alert Rules — Reference02 6개 (요구사항 11, mark 11-4)
# HTTP 메트릭(HighErrorRate/HighLatency)은 앱이 /metrics 를 노출하지 않아
# fluent-bit log_to_metrics 가 액세스 로그에서 생성한 메트릭을 사용한다
# (k8s/logging/fluent-bit.yaml 헤더의 메트릭 이름 참고).
# 주의: 제공 바이너리에 /delay 엔드포인트가 없어(실측) 채점 스크립트의
# latency-gen 으로는 평균 응답 3s 초과를 유발할 수 없다 — 룰은 사양대로 유지 (README).
# ---------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wsc2026-alerts
  namespace: observability
spec:
  groups:
    - name: wsc2026.rules
      rules:
        # Pod CPU 사용률(limit 대비) 80% 를 3분 이상 초과
        - alert: PodHighCPU
          expr: |
            sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!="", image!=""}[2m]))
              / sum by (namespace, pod) (kube_pod_container_resource_limits{resource="cpu"}) > 0.8
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} CPU > 80% for 3m"

        # Pod 메모리 사용률(limit 대비) 90% 를 3분 이상 초과
        - alert: PodHighMemory
          expr: |
            sum by (namespace, pod) (container_memory_working_set_bytes{container!="", image!=""})
              / sum by (namespace, pod) (kube_pod_container_resource_limits{resource="memory"}) > 0.9
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} memory > 90% for 3m"

        # CrashLoopBackOff 이거나 3분 이상 Ready 가 아닌 경우 (완료된 파드 제외)
        - alert: PodNotReady
          expr: |
            (max by (namespace, pod) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) == 1)
            or
            (min by (namespace, pod) (kube_pod_status_ready{condition="true"}) == 0
              and on (namespace, pod) max by (namespace, pod) (kube_pod_status_phase{phase=~"Running|Pending"}) == 1)
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready / crashlooping for 3m"

        # 4xx/5xx 비율이 전체 요청의 5% 를 1분 이상 초과 (로그 기반 메트릭)
        - alert: HighErrorRate
          expr: |
            sum(rate(log_metric_counter_wsc2026_errors_total[1m]))
              / sum(rate(log_metric_counter_wsc2026_requests_total[1m])) > 0.05
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "4xx/5xx error rate > 5% for 1m"

        # 평균 응답 시간이 3초를 1분 이상 초과 (로그 기반 메트릭)
        - alert: HighLatency
          expr: |
            sum(rate(log_metric_histogram_wsc2026_request_duration_seconds_sum[1m]))
              / sum(rate(log_metric_histogram_wsc2026_request_duration_seconds_count[1m])) > 3
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Average response time > 3s for 1m"

        # wsc2026 NS Pod 컨테이너 재시작 3회 초과 상태가 3분 이상 지속
        - alert: PodCrashLooping
          expr: |
            max by (namespace, pod) (kube_pod_container_status_restarts_total{namespace="wsc2026"}) > 3
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted > 3 times"