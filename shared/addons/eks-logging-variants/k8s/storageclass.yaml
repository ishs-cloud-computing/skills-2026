# EBS CSI StorageClass: CMK 암호화 + Pod AZ 맞춤(WaitForFirstConsumer).
# 원본: set-07 task-1 k8s/01-storageclass.yaml. ${KMS_ARN} 은 terraform output addon_ekslog_kms_arn.
# EBS CSI 컨트롤러 SA 역할에 addon_ekslog_ebs_csi_kms_policy_arn 이 붙어 있어야 PV 가 만들어진다.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: addon-gp3-encrypted
  # 클러스터 기본 SC 로 지정하라는 문항일 때만
  # annotations:
  #   storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
# 채점이 PV 잔존을 보면 Retain, 불필요 리소스 감점이면 Delete
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
  kmsKeyId: "${KMS_ARN}"
