# ---------------------------------------------------------------------------
# Karpenter EC2NodeClass / NodePool — 전체 옵션 예시
# 원본: set-07 task-2 module-3 (taint·t3.small/medium), set-08 module-4 (label),
#       set-05 module-1 (limits cpu+memory). 과제지가 요구하지 않는 항목은 지운다.
# ${CLUSTER_NAME} ${NODE_ROLE_NAME} 은 terraform output 으로 치환 후 apply.
# ---------------------------------------------------------------------------
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: addon-nodeclass
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: "${NODE_ROLE_NAME}"
  # private 서브넷에 karpenter.sh/discovery=<클러스터> 태그가 있어야 한다 (terraform vpc.tf)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
  # 클러스터 기본 SG 의 aws:eks:cluster-name 태그로 디스커버리
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: "${CLUSTER_NAME}"
  # 노드 EBS 를 바꾸라는 문항일 때만 (기본 20Gi gp3)
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
  # IMDSv2 강제 + Pod 에서 IMDS 차단 (hop limit 1)
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  tags:
    Name: "${CLUSTER_NAME}-karpenter-node"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: addon-nodepool
spec:
  template:
    metadata:
      # 앱 Deployment nodeSelector 와 일치시킨다 (채점이 노드 label 을 읽는 경우)
      labels:
        dedicated: app
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: addon-nodeclass
      # 앱만 올리는 전용 풀이면 taint + 앱 toleration. DaemonSet 은 toleration 을 따로 준다
      taints:
        - key: dedicated
          value: app
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # spot 을 요구하면 ["spot"] 또는 ["spot", "on-demand"] (spot 우선, 없으면 on-demand)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # 채점 스크립트가 sort 후 문자열 정확 일치로 보는 경우가 있다 (set-07 3-5)
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small", "t3.medium"]
      # 노드 최대 수명. 제한 없음이면 Never
      expireAfter: 720h
  # 풀 전체 상한 — 둘 다 또는 하나만
  limits:
    cpu: "20"
    memory: 40Gi
  disruption:
    # WhenEmpty: 빈 노드만 회수 / WhenEmptyOrUnderutilized: 저활용 노드도 통합
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
    # 동시에 중단되는 노드 수 제한 (없으면 기본 10%)
    budgets:
      - nodes: "1"
